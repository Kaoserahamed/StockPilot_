[project]
name = "stockpilot-backend"
version = "0.1.0"
description = "StockPilot - Inventory & POS SaaS API"
requires-python = ">=3.11"
readme = "README.md"

# ---------------------------------------------------------------------------
# Runtime dependencies - the single source of truth for `uv lock`.
#
# These mirror backend/requirements.txt (the same exact pins). Both artifacts
# are committed and both are verified:
#   * requirements.txt  -> what pip, Docker and CI install
#   * requirements.lock -> the pip-resolved transitive closure
#   * uv.lock           -> the uv-resolved closure (backend/uv.lock)
# `backend/tests/test_dependency_manifests.py` fails the suite if this table
# and requirements.txt ever disagree on a direct pin.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.35.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.16.5",
    "psycopg2-binary==2.9.12",
    "PyMySQL==1.1.2",
    "pydantic==2.11.7",
    "pydantic-settings==2.15.0",
    "email-validator==2.2.0",
    "PyJWT==2.13.0",
    "bcrypt==4.0.1",
    "python-multipart==0.0.32",
    "reportlab==5.0.1",
    "openpyxl==3.1.5",
    "google-generativeai==0.8.6",
    "PyYAML==6.0.3",
    "python-json-logger==4.2.0",
    "slowapi==0.1.10",
    "sentry-sdk==2.22.0",
]

# ---------------------------------------------------------------------------
# uv - lockfile configuration
#
# The backend is an application, not a distributable library, so uv is told not
# to build or install the project itself; it only resolves and locks the
# dependency closure into uv.lock:
#
#     cd backend && uv lock            # regenerate uv.lock
#     cd backend && uv lock --check    # fail if uv.lock is stale (CI)
# ---------------------------------------------------------------------------
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff: linting + formatting (single tool replaces black, isort and flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = [".venv", "venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in a default value.
    "B008",
    # SQLAlchemy declarative models and Pydantic config use class-level mutables.
    "RUF012",
    # Ambiguous unicode in comments/docstrings (en dash in prose) is intentional.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: tests that take noticeable time to run",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/main.py",
    "alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
exclude = ["alembic/versions"]

